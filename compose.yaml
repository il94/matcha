services:

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

    restart: always

  db:
    image: postgres:16.1
    env_file: ./back/.env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  back:
    depends_on:
      - db
      - redis
    build: 
      context: ./back
      dockerfile: Dockerfile
    env_file: ./back/.env
    ports:
      - "3009:3009"
    restart: on-failure
    # Supprimer les volumes en prod
    volumes:
      - ./back:/app
      - node_modules_back:/app/node_modules

  front:
    depends_on:
      - back
    build: 
      context: ./front
      dockerfile: Dockerfile
    env_file: ./front/.env
    ports:
      - "5173:5173"
      - "4009:4009"
    # Supprimer les volumes en prod
    volumes:
      - ./front:/app
      - node_modules_front:/app/node_modules

volumes:
  db_data:
  redis_data:
  # Supprimer les volumes en prod
  node_modules_back:
  node_modules_front: